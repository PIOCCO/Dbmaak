services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: receptionist
      POSTGRES_PASSWORD: receptionist
      POSTGRES_DB: receptionist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  agent:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://receptionist:receptionist@postgres:5432/receptionist
    depends_on:
      - postgres
    command: ["python", "agent/main.py", "start"]

volumes:
  pgdata:
